<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Security API Suite</title>
  <link rel="stylesheet" href="css/styles.css?v=8">
</head>
<body>
  <div class="container" style="max-width: 480px; margin-top: 3rem;">
    <header class="app-header">
      <span class="badge">OpenLDAP Authentication</span>
      <h1>Login</h1>
      <p class="subtitle">Sign in to access the security testing suite</p>
    </header>

    <main class="card">
      <div id="login-error-banner" class="security-banner hidden" style="background-color: var(--status-error-bg); color: var(--status-error-text); margin-bottom: 1.5rem;">
        ⚠️ <strong>Authentication Failed:</strong> <span id="login-error-text">Invalid username or password.</span>
      </div>

      <form id="login-form" style="display: flex; flex-direction: column; gap: 1.25rem;">
        <div>
          <label style="display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem;">Username:</label>
          <input type="text" id="ldap-username" style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border-color); border-radius: 0.5rem; font-size: 1rem;" placeholder="e.g. alice or bob" required>
        </div>
        <div>
          <label style="display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem;">Password:</label>
          <input type="password" id="ldap-password" style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border-color); border-radius: 0.5rem; font-size: 1rem;" required>
        </div>
        <button type="submit" id="ldap-login-btn" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem; margin-top: 0.5rem;">
          🔑 Sign In
        </button>
      </form>
    </main>

    <footer class="app-footer">
      <p>OpenLDAP Directory Service Integration</p>
    </footer>
  </div>

  <script src="js/login.js?v=8"></script>
</body>
</html>
